plugins {
    id 'me.qoomon.git-versioning' version '6.4.4'
}

gitVersioning.apply {

    refs {
        considerTagsOnBranches = false
        branch('master') {
            version = '${ref}-SNAPSHOT'
            properties["foo"] = "foo@gradle"
        }
    }
    rev {
        version = '${commit}-TEST'
    }
}
