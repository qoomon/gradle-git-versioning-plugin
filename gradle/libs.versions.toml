[versions]
java = "17"
junit = "6.1.3"

[libraries]
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version = "7.8.0.202609011348-r" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version = "3.10.0" }
commons-configuration2 = { module = "org.apache.commons:commons-configuration2", version = "2.15.1" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }

[plugins]
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
test-logger = { id = "com.adarshr.test-logger", version = "4.0.0" }
versions = { id = "com.github.ben-manes.versions", version = "0.54.0" }
